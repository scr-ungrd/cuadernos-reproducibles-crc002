<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" width="720" height="776" role="img" aria-labelledby="t d" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
<title id="t">Flujo de modelación del tsunami de Tumaco de 1979</title>
<desc id="d">Cinco etapas: datos de entrada; escenario sísmico, dislocación de Okada y condición inicial; propagación con aguas someras lineales; lectura en celdas de mar cercanas a la costa; y tres productos del escenario determinista de Mw 8,3.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2733"/></marker></defs>
<rect x="0" y="0" width="720" height="112" fill="#cfe8a9"/>
<text x="12" y="23.7" font-size="10.5" font-weight="400" text-anchor="start" fill="#1c2733" opacity=".65">ENTRADAS</text>
<text x="12" y="44.9" font-size="14" font-weight="700" text-anchor="start" fill="#1c2733">Datos de</text>
<text x="12" y="61.9" font-size="14" font-weight="700" text-anchor="start" fill="#1c2733">entrada</text>
<polygon points="134,16 261,16 251,68 124,68" fill="#f3fae5" stroke="#1c2733" stroke-width="1.2"/>
