<text x="192.5" y="52.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">(450 m, UTM 17N)</text>
<line x1="192.5" y1="68" x2="192.5" y2="86" stroke="#1c2733" stroke-width="1.2"/>
<polygon points="284,16 411,16 401,68 274,68" fill="#f3fae5" stroke="#1c2733" stroke-width="1.2"/>
<text x="342.5" y="38.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">Magnitud Mw 8,3</text>
<text x="342.5" y="52.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">(literatura)</text>
<line x1="342.5" y1="68" x2="342.5" y2="86" stroke="#1c2733" stroke-width="1.2"/>
<polygon points="434,16 561,16 551,68 424,68" fill="#f3fae5" stroke="#1c2733" stroke-width="1.2"/>
<text x="492.5" y="38.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">Geometría de la falla</text>
<text x="492.5" y="52.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">(supuesto)</text>
<line x1="492.5" y1="68" x2="492.5" y2="86" stroke="#1c2733" stroke-width="1.2"/>
<polygon points="584,16 711,16 701,68 574,68" fill="#f3fae5" stroke="#1c2733" stroke-width="1.2"/>
<text x="642.5" y="38.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">Observaciones de 1979</text>
<text x="642.5" y="52.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1c2733">(NOAA/NGDC, Herd)</text>
<line x1="642.5" y1="68" x2="642.5" y2="86" stroke="#1c2733" stroke-width="1.2"/>
<line x1="192.5" y1="86" x2="642.5" y2="86" stroke="#1c2733" stroke-width="1.2"/>
<rect x="0" y="112" width="720" height="252" fill="#fff3a0"/>
<text x="12" y="135.7" font-size="10.5" font-weight="400" text-anchor="start" fill="#1c2733" opacity=".65">PASOS 1 Y 2</text>
<text x="12" y="156.9" font-size="14" font-weight="700" text-anchor="start" fill="#1c2733">Fuente</text>
<line x1="217.0" y1="86" x2="217.0" y2="132" stroke="#1c2733" stroke-width="1.2"/>
<text x="217.0" y="145.8" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2733">Escenario sísmico</text>
<rect x="124" y="154" width="186" height="58" rx="14" fill="#fffde8" stroke="#1c2733" stroke-width="1.2"/>
<text x="217.0" y="173.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">Magnitud de la literatura;</text>
<text x="217.0" y="187.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">geometría supuesta</text>
<text x="217.0" y="201.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">(200 × 80 km, buzam. 15°)</text>
<line x1="217.0" y1="212" x2="217.0" y2="236" stroke="#1c2733" stroke-width="1.2" marker-end="url(#ar)"/>
