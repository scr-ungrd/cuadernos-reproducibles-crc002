<text x="217.0" y="270.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">rumbo 30°, desplaz. 90°,</text>
<text x="217.0" y="284.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">deslizamiento de 7,4 m</text>
<line x1="217.0" y1="296" x2="217.0" y2="310" stroke="#1c2733" stroke-width="1.2"/>
<line x1="418.0" y1="86" x2="418.0" y2="132" stroke="#1c2733" stroke-width="1.2"/>
<text x="418.0" y="145.8" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2733">Dislocación de Okada</text>
<rect x="325" y="154" width="186" height="58" rx="14" fill="#fffde8" stroke="#1c2733" stroke-width="1.2"/>
<text x="418.0" y="173.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">Deformación elástica</text>
<text x="418.0" y="187.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">del fondo marino</text>
<text x="418.0" y="201.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">(rigidez 30 GPa, Poisson 0,25)</text>
<line x1="418.0" y1="212" x2="418.0" y2="236" stroke="#1c2733" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="325" y="236" width="186" height="60" fill="#ffffff" stroke="#1c2733" stroke-width="1.2"/>
<text x="418.0" y="256.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">Contraste con otra</text>
<text x="418.0" y="270.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">implementación (pyrocko):</text>
<text x="418.0" y="284.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">diferencia &lt; 1e-5 m</text>
<line x1="418.0" y1="296" x2="418.0" y2="310" stroke="#1c2733" stroke-width="1.2"/>
<line x1="619.0" y1="86" x2="619.0" y2="132" stroke="#1c2733" stroke-width="1.2"/>
<text x="619.0" y="145.8" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2733">Condición inicial</text>
<rect x="526" y="154" width="186" height="58" rx="14" fill="#fffde8" stroke="#1c2733" stroke-width="1.2"/>
<text x="619.0" y="173.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">Deformación vertical = η</text>
<text x="619.0" y="187.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">inicial en la malla</text>
<text x="619.0" y="201.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">de 450 m</text>
<line x1="619.0" y1="212" x2="619.0" y2="236" stroke="#1c2733" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="526" y="236" width="186" height="60" fill="#ffffff" stroke="#1c2733" stroke-width="1.2"/>
<text x="619.0" y="263.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">De +3,1 m (levantamiento)</text>
<text x="619.0" y="277.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1c2733">a −1,3 m (hundimiento)</text>
<line x1="619.0" y1="296" x2="619.0" y2="310" stroke="#1c2733" stroke-width="1.2"/>
<line x1="217.0" y1="310" x2="619.0" y2="310" stroke="#1c2733" stroke-width="1.2"/>
