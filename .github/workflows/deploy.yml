name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          # Versiones exactas de environment.yml (verificadas el 2026-11-17)
          pip install --quiet \
            numpy==2.2.6 pandas==2.3.3 matplotlib==3.10.9 pillow==13.0.0 \
            pyproj==3.7.1 rasterio==1.4.4 affine==3.0.1 requests==2.34.2 \
            ipykernel==7.3.0 jupyterlab==4.6.6 nbconvert==7.17.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mystmd
        run: npm install -g mystmd@1.13.0

      - name: Pruebas de los datos
        run: python scripts/probar_datos.py

      - name: Execute notebook 1 — batimetría
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            01-bathymetry.ipynb

      - name: Execute notebook 2 — simulación
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            02-simulation.ipynb

      - name: Execute notebook 3 — visualización
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            03-visualization.ipynb

      - name: Install fonts (Liberation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Install Typst
        env:
          TYPST_VERSION: v0.15.0
          TYPST_SHA256: 59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Build PDF (Typst)
        run: myst build --typst
        continue-on-error: true

      - name: Build MyST site
        run: myst build --html
        env:
          BASE_URL: /cuadernos-reproducibles-crc002
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
